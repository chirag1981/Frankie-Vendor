name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android SDK Licenses
        run: |
          yes | flutter doctor --android-licenses || true
          flutter doctor -v

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Build Tools & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-cli fpdf2

      - name: Build Android APK (Optimized & Split by ABI)
        run: |
          flet build apk . \
            --project "QuickVendorInvoice" \
            --product "Quick Vendor Invoice" \
            --org "com.vendor.invoice" \
            --module-name main \
            -o build/apk \
            --split-per-abi \
            --cleanup-packages \
            --cleanup-app \
            --android-permissions "android.permission.INTERNET=true" "android.permission.QUERY_ALL_PACKAGES=true" \
            --yes \
            --no-rich-output \
            -vv

      - name: List Generated Build Files
        if: always()
        run: |
          ls -lh build/apk/ || true
          find build -type f -name "*.apk" -exec ls -lh {} + || true

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Quick-Vendor-Invoice-APKs
          path: |
            build/apk/*.apk
            build/apk/**/*.apk
            build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
