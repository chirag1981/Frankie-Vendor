name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Version
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Code
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build Optimized Release APKs
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Prepare Lightweight Named APKs
        run: |
          mkdir -p dist_apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist_apk/Frankie-Vendor-Samsung-and-Phones-arm64.apk || true
          cp build/app/outputs/flutter-apk/app-release.apk dist_apk/Frankie-Vendor-Universal.apk || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Frankie-Vendor-APK
          path: dist_apk/*.apk
          if-no-files-found: warn
          retention-days: 30
