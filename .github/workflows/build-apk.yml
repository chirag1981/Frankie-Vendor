name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies & Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet fpdf2

      - name: Verify Environment
        run: |
          flutter doctor -v

      - name: Build Android APK
        run: |
          flet build apk --project "QuickVendorInvoice" --product "Quick Vendor Invoice" --org "com.vendor.invoice" -v

      - name: Locate & Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quick-Vendor-Invoice-APK
          path: |
            build/apk/*.apk
            build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
